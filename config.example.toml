# Copy this file to config.toml and fill in your values.
# config.toml is gitignored because it contains the client secret.
# The client secret may instead be supplied via the
# DEMO_STUDENT_CLIENT_SECRET environment variable.

# --- required ---
host = "yourschool.brightspace.com"           # D2L hostname, no scheme
clientId = "your-oauth2-client-id"
clientSecret = "your-oauth2-client-secret"
redirectUri = "https://localhost:8443/callback"  # must match the registered redirect URI

# --- optional (defaults shown) ---
# proxyUrl = "http://127.0.0.1:8080"  # send every D2L API call through apiProxy2.
#                                     # Unset (the default), the tool calls D2L
#                                     # directly. Use https:// for a proxy on
#                                     # another machine, since each request
#                                     # carries your bearer token.
#
# scope = "core:*:*"              # catch-all; grants far more than this tool uses
#
# Minimum scope this tool actually needs. Register these on the OAuth2
# application first, then uncomment the line below (spaces separate scopes,
# commas separate permissions on the same resource):
#   organizations:organization:read  org unit lookup, children, descendants
#   users:userdata:read              find the demo student by username
#   users:userdata:create            create the demo student
#   enrollment:orgunit:read          check the demo student's enrollment
#   enrollment:orgunit:create        enroll the demo student
#   users:own_profile:read           the whoami check run by `demo-student auth`
# scope = "enrollment:orgunit:create,read organizations:organization:read users:own_profile:read users:userdata:create,read"
#
# The delete-orphans command needs two more scopes on top of those:
#   users:activation:update          deactivate an orphaned demo student
#   users:userdata:delete            --hard-delete only
#   datasets:bds:read                read the Users extract; without it the
#                                    orphan commands fall back to the live API
# With them, the full string is:
# scope = "datasets:bds:read enrollment:orgunit:create,read organizations:organization:read users:activation:update users:own_profile:read users:userdata:create,read,delete"
#
# Scopes are fixed when the token is issued and do not change on refresh:
# after editing this line, re-run `demo-student auth`. Scopes alone are not
# enough — the signed-in account's Brightspace role must also have authority
# in every course offering. See "Brightspace access requirements" in README.md.
#
# roleId = 783                    # the "Demo Student" role id; must NOT be a
#                                 # cascading role (see README.md)
# orgOu = 1070555                 # organization org unit; every course offering
#                                 # beneath it is discovered
# courseOfferingOuType = 3        # org unit type id for course offerings
# usernamePrefix = "demo"         # usernames become demo.{orgUnitId}
# firstName = "Demo"
# lastName = "Student"
# externalEmailDomain = "student.gsu.edu"
# maxWorkers = 8                  # worker threads for course processing
# workingDir = "working"          # holds the SQLite db, tokens, mkcert certs, and logs/
# logDir = "logs"                 # log directory; relative to workingDir unless absolute
#
# Windows paths: a backslash starts an escape sequence inside a double-quoted
# TOML string, so "C:\Users\me" fails to parse with "Invalid hex value". Use a
# single-quoted literal string or forward slashes:
# workingDir = 'C:\Users\me\demoStudent\working'
# workingDir = "C:/Users/me/demoStudent/working"
# logFilePrefix = "demoStudent"   # log files become {logFilePrefix}_YYYYMM.log
