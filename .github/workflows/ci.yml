name: Test and Deploy

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest

  deploy-dev:
    needs: test
    runs-on: [self-hosted, cetlodevweb02]
    environment: development
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    env:
      APP_DIR: /apps/local/cetlocron/data/apps/demoStudent
    steps:
      - uses: actions/checkout@v4
      - name: Install/update demoStudent.sh script
        run: |
          mkdir -p /data/cetlocron/bin
          cp bin/demoStudent.sh /data/cetlocron/bin/demoStudent.sh
          chmod +x /data/cetlocron/bin/demoStudent.sh
      - name: Sync code
        run: |
          mkdir -p "$APP_DIR"
          rsync -av --delete --exclude 'config.toml' --exclude 'working/' ./ "$APP_DIR"/
      - uses: astral-sh/setup-uv@v3
      - working-directory: /apps/local/cetlocron/data/apps/demoStudent
        run: uv sync
      - name: Ensure cron job is installed
        run: |
          CRON_BIN="/data/cetlocron/bin"
          CRON_LOG="/data/cetlocron/logs/cron"

          CRON_HEADER="## demoStudent cron job"
          CRON_MARKER="# demoStudent-cron"

          # \` keeps the backtick literal, \% is the cron-escaped percent sign
          CRON_CMD="${CRON_BIN}/demo-student-import >> ${CRON_LOG}-\`date +\%Y-\%m-\%d\`.out 2>&1 ${CRON_MARKER}"

          CRON_LINE_1=$(printf '0\t9-21/3\t*\t*\t*\t%s' "$CRON_CMD")
          CRON_LINE_2=$(printf '0\t23\t*\t*\t*\t%s' "$CRON_CMD")

          (
            crontab -l 2>/dev/null | grep -v "$CRON_MARKER" | grep -v "^$CRON_HEADER$" || true
            echo "$CRON_HEADER"
            echo "$CRON_LINE_1"
            echo "$CRON_LINE_2"
          ) | crontab -

          crontab -l

  deploy-prod:
    needs: test
    runs-on: [self-hosted, cetloprodweb02]
    environment: production
    if: github.event_name == 'release'
    env:
      APP_DIR: /apps/local/cetlocron/data/apps/demoStudent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install/update demoStudent.sh script
        run: |
          mkdir -p /data/cetlocron/bin
          cp bin/demoStudent.sh /data/cetlocron/bin/demoStudent.sh
          chmod +x /data/cetlocron/bin/demoStudent.sh
      - name: Sync code
        run: |
          mkdir -p "$APP_DIR"
          rsync -av --delete --exclude 'config.toml' --exclude 'working/' ./ "$APP_DIR"/
      - uses: astral-sh/setup-uv@v3
      - working-directory: /apps/local/cetlocron/data/apps/demoStudent
        run: uv sync
      - name: Ensure cron job is installed
        run: |
          CRON_BIN="/data/cetlocron/bin"
          CRON_LOG="/data/cetlocron/logs/cron"

          CRON_HEADER="## demoStudent cron job"
          CRON_MARKER="# demoStudent-cron"

          # \` keeps the backtick literal, \% is the cron-escaped percent sign
          CRON_CMD="${CRON_BIN}/demo-student-import >> ${CRON_LOG}-\`date +\%Y-\%m-\%d\`.out 2>&1 ${CRON_MARKER}"

          CRON_LINE_1=$(printf '0\t9-21/3\t*\t*\t*\t%s' "$CRON_CMD")
          CRON_LINE_2=$(printf '0\t23\t*\t*\t*\t%s' "$CRON_CMD")

          (
            crontab -l 2>/dev/null | grep -v "$CRON_MARKER" | grep -v "^$CRON_HEADER$" || true
            echo "$CRON_HEADER"
            echo "$CRON_LINE_1"
            echo "$CRON_LINE_2"
          ) | crontab -

          crontab -l
