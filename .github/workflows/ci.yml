name: Test and Deploy

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest

  deploy-dev:
    needs: test
    runs-on: [self-hosted, cetlodevweb02]
    environment: development
    if: github.ref == 'refs/heads/develop'
    env:
      APP_DIR: /apps/local/cetlocron/data/apps/demoStudent
    steps:
      - uses: actions/checkout@v4
      - name: Sync code
        run: |
          mkdir -p "$APP_DIR"
          rsync -av --delete --exclude 'config.toml' --exclude 'working/' ./ "$APP_DIR"/
      - uses: astral-sh/setup-uv@v3
      - working-directory: /apps/local/cetlocron/data/apps/demoStudent
        run: uv sync

  deploy-prod:
    needs: test
    runs-on: [self-hosted, cetloprodweb02]
    environment: production
    if: github.ref == 'refs/heads/master'
    env:
      APP_DIR: /apps/local/cetlocron/data/apps/demoStudent
    steps:
      - uses: actions/checkout@v4
      - name: Sync code
        run: |
          mkdir -p "$APP_DIR"
          rsync -av --delete --exclude 'config.toml' --exclude 'working/' ./ "$APP_DIR"/
      - uses: astral-sh/setup-uv@v3
      - working-directory: /apps/local/cetlocron/data/apps/demoStudent
        run: uv sync
